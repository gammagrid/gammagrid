name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      # Runs the unit and smoke scripts and fails if either breaks OR if any
      # non-exempt function in db.py/metrics.py/collector.py has no check
      # calling it at all.
      - name: Tests and coverage
        run: python tests/coverage_report.py

      # Separate on purpose: rendering the page calls a lot of db.py on the way
      # past, and letting that count toward coverage would make the number mean
      # "something touched this" rather than "a check verified this".
      - name: Render every view
        run: python tests/render_views.py

      - name: Docker build
        run: docker build -t gammagrid .
